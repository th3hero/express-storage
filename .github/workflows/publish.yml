name: Publish Package

on:
    release:
        types: [created]

permissions:
    id-token: write
    contents: write

jobs:
    publish-npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            # Do not set registry-url: setup-node injects a dummy NODE_AUTH_TOKEN
            # that blocks OIDC Trusted Publishing and causes E403 under
            # "disallow bypass 2FA tokens" package policy.
            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Get version from release tag
              id: version
              run: |
                  VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^[vV]//')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Publishing version: $VERSION"

            - name: Update package.json version
              run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish to NPM (Trusted Publishing)
              run: |
                  if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
                    echo "NODE_AUTH_TOKEN must be unset for Trusted Publishing"
                    exit 1
                  fi
                  test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
                  test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
                  npm publish --access public --registry=https://registry.npmjs.org

    update-repo:
        name: Update Repository
        runs-on: ubuntu-latest
        needs: publish-npm
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Update package.json version
              run: npm version ${{ needs.publish-npm.outputs.version }} --no-git-tag-version --allow-same-version

            - name: Commit and push version update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  git diff --staged --quiet || git commit -m "chore: bump version to ${{ needs.publish-npm.outputs.version }}"
                  git push origin main
