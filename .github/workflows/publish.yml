name: Publish Package

on:
    release:
        types: [created]

permissions:
    id-token: write
    contents: write

jobs:
    publish-npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: Get version from release tag
              id: version
              run: |
                  VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^[vV]//')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Publishing version: $VERSION"

            - name: Update package.json version
              run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # setup-node writes _authToken=${NODE_AUTH_TOKEN} into npmrc.
            # With no token that becomes empty auth and blocks OIDC trusted publishing.
            - name: Publish to NPM (Trusted Publishing)
              run: |
                  npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
                  [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc" || true
                  unset NODE_AUTH_TOKEN
                  unset NPM_TOKEN
                  npm publish --access public

    update-repo:
        name: Update Repository
        runs-on: ubuntu-latest
        needs: publish-npm
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Update package.json version
              run: npm version ${{ needs.publish-npm.outputs.version }} --no-git-tag-version --allow-same-version

            - name: Commit and push version update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  git diff --staged --quiet || git commit -m "chore: bump version to ${{ needs.publish-npm.outputs.version }}"
                  git push origin main
